[OnFrame_Enabled]
$120FPS [Sunshine Overdrive]

# Détail des trois écritures
# ==========================
#
#   0x804167B8  0.5f -> 2.0f
#       Littéral lu par SMSGetVSyncTimesPerSec(), qui renvoie 60.0 × ce
#       littéral : 120.0 au lieu de 30.0. Deux effets d'un coup —
#         - vsyncRate = 600 / 120 = 5, soit exactement un sous-pas par image
#           rendue, le quantum de l'accumulateur valant 5 ;
#         - SMSGetAnmFrameRate() = 60 / 120 = 0.5, les animations J3D avancent
#           d'une demi-image d'animation par image de jeu.
#       Vérifié au désassembleur : lfs f0,-0x3e8(r2) dans
#       SMSGetVSyncTimesPerSec. Effet de bord connu : TApplication::drawDVDErr()
#       lit le même littéral.
#
#   0x802FCB24  bl VIWaitForRetrace -> nop
#       Dernière attente de JDrama::TVideo::waitForRetrace. En régime permanent
#       cela consomme mRetraceCount - 1 champs par appel, soit 1 avec la valeur
#       NTSC 2. Démonstration en docs/01-mecanismes.md § 3.1, loi de
#       présentation mesurée au § 3.2.
#
#   0x80002F04 … 0x80002F68  routines particules et drapeaux JAI, générées par
#       `python tools/build_caves.py` — ne pas éditer ces lignes à la main.
#       Zone 0x80001800–0x80003000, inutilisée par le jeu et réservée au
#       codehandler Gecko de Dolphin : **incompatible avec l'activation de
#       codes Gecko** pour ce jeu. L'accumulateur 0x80002F00 n'est
#       volontairement pas écrit ici : [OnFrame] le remettrait à zéro à chaque
#       champ.
#
#   0x802887B0  lwz r23,0x94(r1) -> bl 0x80002F10   (particules)
#       Dégèle les particules à la bonne vitesse. Dans TMarioParticleManager::perform, le nombre
#       d'appels à JPAEmitterManager::calc() par image rendue est
#       (int)SMSGetAnmFrameRate() :
#
#           802887A4  bl SMSGetAnmFrameRate()
#           802887A8  fctiwz f0, f1              <- troncature
#           802887B0  lwz    r23, 0x94(r1)       <- le compteur de boucle
#           802887B8  bl     JPAEmitterManager::calc()
#           802887C0  addi   r23, r23, -1
#           802887C8  bgt    802887B8
#
#       30 FPS -> (int)2.0 = 2 appels. 60 FPS -> (int)1.0 = 1.
#       120 FPS -> (int)0.5 = 0 : le système de particules n'avance plus.
#       Tout ce qui est JPA fige — les jets d'eau de la place, entre autres.
#
#       BetterSunshineEngine ne corrige pas ce point : son src/patches/fps.cpp
#       ne mentionne ni JPA, ni le gestionnaire de particules. Son mode 120 FPS
#       a donc le même défaut.
#
#       Première version (li r23,1) : particules dégelées mais à 120 Hz, deux
#       fois trop vite — constaté à l'œil le 2026-09-22 sur les jets d'eau.
#       Remplacée par un accumulateur, qui remplace la troncature :
#           acc += SMSGetAnmFrameRate();  r23 = partie entière;  acc -= r23
#       2.0 -> 2 appels ; 1.0 -> 1 ; 0.5 -> 0 puis 1 en alternance. Soit
#       60 appels/s à tous les paliers : correct par construction.
#
#   0x8030D344 -> b 0x80002F40 ; 0x80307CF0, 0x8030669C -> nop   (musique)
#       Corrige les musiques qui se figent (place, égouts : relevé deux fois,
#       tempo JASystem à 0, multiplicateur TOuterParam+0x18 à 0).
#       Au démarrage d'une séquence, outerInit (fil audio) met en file une
#       commande de port portant les drapeaux 0xff (volume … tempo). La couche
#       JAI (fil du jeu) écrit ensuite les drapeaux du moment par ÉCRASEMENT
#       (setSeqPortargsU32 : stw) et remet la commande en file après avoir
#       effacé son marqueur. Si le rappel audio n'a pas encore traité la
#       commande, le bit du tempo est perdu. À 30 Hz la fenêtre est rarement
#       atteinte ; à 120 Hz, souvent.
#       Routine : fusion (or) des drapeaux si la commande est encore en file
#       (marqueur +0x2C non nul), écrasement sinon — le consommateur efface
#       chaque bit appliqué, donc rien n'est réappliqué à tort. Interruptions
#       masquées (MSR.EE) le temps de la lecture-écriture. Les deux nop
#       suppriment l'effacement du marqueur : addPortCmdOnce refuse alors de
#       chaîner deux fois une commande déjà en file.
#
#   (retiré) 0x802A62DC  limitation de MSound::mainLoop à 30 Hz
#       Posée pour une musique de la place figée (tempo JASystem à 0), retirée
#       le même jour après test A/B à l'oreille : elle faisait perdre les sons
#       d'animation de Mario (0x1969, glissade sur l'eau : 6 déclenchements
#       en 45 s à 120 Hz, 1 seul à 30 Hz), et la musique boucle normalement
#       sans elle. La cause du premier gel reste inconnue ;
#       `python tools/watch_audio.py` le détecte s'il revient.
#
#   0x801EC29C  lfs f0,-0x223c(r2) -> lfs f0,-0x2a9c(r2)   (portails TModelGate)
#       Rend les portails graffiti franchissables. Leur jauge d'ouverture
#       (+0xD0) gagne 0.01 par SOUS-PAS (perform, flag 1) et perd +0xD8 par
#       IMAGE RENDUE tant qu'ils sont fermés (perform, flag 2). +0xD8 est
#       recopié par TModelGate::loadAfter depuis 0x80414964 = 0.02.
#           30 FPS  : +1.2/s - 0.6/s = +0.6/s   -> ouvert en ~1,7 s (origine)
#           60 FPS  : +1.2/s - 1.2/s =  0        -> jamais
#           120 FPS : +1.2/s - 2.4/s = -1.2/s    -> jamais (relevé en jeu :
#                     jauge alternant 0.00 / 0.01, portail infranchissable)
#       Le chargement vise désormais 0x80414104 = 0.005f (= 0.02 x 30/120),
#       constante préexistante de .sdata2 lue sinon par TLeanBlock seul :
#       +1.2 - 0.6 = +0.6/s, la dynamique d'origine. Pris effet au chargement
#       d'un niveau. Valeur propre au palier 120.
#       Ceci tranche l'anomalie 0x80414904 (docs/01-mecanismes.md § 4.3) : le
#       0.01 -> 0.02 / 0.04 de gamemasterplc et BSE compense ce décrément, au
#       prix d'une ouverture 2x / 4x trop rapide. 0x80414904 reste intact ici.
#       Non corrigés, cosmétiques : +0xDC (0.025, fermeture en état >= 2 ;
#       0.00625f n'existe pas dans le DOL), le lissage du flou +0xE8 et la
#       durée d'ouverture +0xC8 (360 images), tous par image rendue, donc
#       4x plus rapides.
#
# Délibérément absent — ne pas ajouter par imitation
# ==================================================
#
#   0x80414904  0.01f -> 0.04f   (fondu TModelGate)
#       gamemasterplc et BetterSunshineEngine font progresser ce littéral avec
#       la cadence. L'analyse du site d'usage dit qu'il faudrait soit ne rien
#       faire, soit diviser — jamais multiplier. L'expérience qui tranche n'a
#       pas été faite, faute d'un niveau contenant un TModelGate.
#       Voir docs/01-mecanismes.md § 4.3.
#
# Pourquoi [OnFrame] et non [Gecko]
# =================================
# Les deux premières écritures ont d'abord été livrées en section [Gecko], sur
# le modèle du $60FPS de gamemasterplc. Elles n'ont pas été chargées : le
# 2026-09-22, jeu démarré avec ces lignes en [Gecko] et le nom repris en
# [Gecko_Enabled], Dolphin n'avait injecté aucun codehandler — 0x80001800
# entièrement nul — alors que la section [Core] du même fichier avait bien pris
# effet. Cause non élucidée ; [OnFrame] emprunte un autre chemin dans Dolphin,
# le PatchEngine, qui applique ses écritures avant que le JIT ne compile le
# bloc concerné.
