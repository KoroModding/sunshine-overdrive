# GMSE01 — Super Mario Sunshine (NTSC-U)
# Sunshine Overdrive — profil 120 FPS, vitesse de jeu correcte.
#
# À placer dans le répertoire utilisateur de Dolphin, sous GameSettings/
# (Windows : %APPDATA%\Dolphin Emulator\GameSettings\GMSE01.ini), à la main
# ou par `python tools/install_profile.py install`. Il s'ajoute à
# Sys/GameSettings/GMSE01.ini sans le remplacer.
#
# Tout ici est lu **à l'amorçage**. Redémarrer le jeu après installation.
#
# NE PAS activer de codes Gecko / Action Replay pour ce jeu : le profil loge
# ses routines dans la zone 0x80001800–0x80003000, celle du gestionnaire Gecko.
#
# ATTENTION : la section [Core] seule fait tourner le jeu à DOUBLE VITESSE. Le
# VI délivre deux fois plus de champs, et le jeu non corrigé les consomme au
# même rythme qu'avant. Les deux sections vont ensemble.

[Core] seule fait tourner le jeu à DOUBLE VITESSE. Le
# VI délivre deux fois plus de champs, et le jeu non corrigé les consomme au
# même rythme qu'avant. Si [OnFrame] ne s'applique pas, lancer
# `python tools/keep120.py`, qui pose la même cadence par écriture de données.

[Core]
# VBI Frequency Override à 2×. 59,94 × 2 = 119,88 champs/s.
# C'est la seule moitié du profil qui ne puisse pas être posée depuis la MEM1 :
# elle vit dans Dolphin, pas dans la GameCube émulée.
VIOverclockEnable = True
VIOverclock = 2.0

